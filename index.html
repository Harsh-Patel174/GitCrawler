<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>GitSearch</title>
</head>
<body>
    <div class="container">
        <h1>GitCrawler</h1>

        <input type="text" id="username" placeholder="Enter GitHub username">
        <button id="findBtn">Find</button>

        
        <img id="profileImage" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQwPs4aLjB6PrVFbGobXz0h7wluc7p07sCyaPnyTHvWSA&s=10" alt="GitHub Profile Picture">

        
        <p id="name">Name:</p>
        <p id="bio">Bio:</p>
        <p>Followers: </p>
        <p id="followers">Followers:</p>
        <p id="projects">Projects: </p>
    </div>

    <script src="script.js"></script>
</body>
</html>
